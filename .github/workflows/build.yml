name: Bun Build

on:
  push:
    branches: ['master']

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build Linux Executable
        run: bun build ./source/cli.tsx --compile --target linux-x64 --outfile kujira-cli-linux

      - name: Fix Linux permissions
        run: chmod +x kujira-cli-linux

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kujira-cli-linux
          path: kujira-cli-linux

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build Windows Executable
        run: bun build ./source/cli.tsx --compile --target windows-x64 --outfile kujira-cli-windows.exe

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kujira-cli-windows
          path: kujira-cli-windows.exe
