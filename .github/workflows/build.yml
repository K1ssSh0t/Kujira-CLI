name: Build Executables

on:
  workflow_dispatch:  # Solo se ejecuta manualmente

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [linux, windows]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Bundle CLI
        run: bun build --bundle source/cli.tsx --outfile dist/bin.js --target=bun

      - name: Run shim
        run: bun shim.ts

      - name: Compile executable
        run: |
          bun build --compile --minify --sourcemap dist/bin.js \
            --target=bun-${{ matrix.target == 'linux' && 'linux-x64' || 'windows-x64' }} \
            --outfile dist/kujira-cli-${{ matrix.target }}
          rm dist/bin.js

      - name: Fix Linux permissions
        if: matrix.target == 'linux'
        run: chmod +x dist/kujira-cli-linux

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kujira-cli-${{ matrix.target }}
          path: dist/kujira-cli-${{ matrix.target }}