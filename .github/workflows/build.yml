name: Build and Release

on:
  push:
    tags:
      - "v*" # Se activa con tags que empiecen con 'v' (ej: v1.0.0)
  workflow_dispatch: # Permite ejecutarlo manualmente

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.24.x"
          cache: true

      - name: Install dependencies
        run: |
          # Instalar rsrc para Windows
          go install github.com/akavel/rsrc@latest
          # Instalar dependencias para la compilación cruzada
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64 gcc-multilib

      - name: Install ImageMagick
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Build all targets
        run: |
          make build-all

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kujira-cli-binaries
          path: |
            dist/linux/kujira-cli
            dist/windows/kujira-cli.exe
            dist/macos/kujira-cli
          if-no-files-found: error

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/linux/kujira-cli
            dist/windows/kujira-cli.exe
            dist/macos/kujira-cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
