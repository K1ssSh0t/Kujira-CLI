name: Build and Release

on:
  push:
    tags:
      - "v*" # Se activa con tags que empiecen con 'v' (ej: v1.0.0)
  workflow_dispatch: # Permite ejecutarlo manualmente

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.24.x"
          cache: true

      - name: Build Linux binaries
        run: |
          make prepare-dist
          make build-linux

      - name: Upload Linux AMD64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kujira-cli-linux-amd64
          path: dist/linux/kujira-cli
          if-no-files-found: error

      - name: Upload Linux ARM64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kujira-cli-linux-arm64
          path: dist/linux/kujira-cli-arm64
          if-no-files-found: error

  build-windows:
    name: Build Windows
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.24.x"
          cache: true

      - name: Install Windows build dependencies
        run: |
          go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@latest

      - name: Build Windows binary
        run: |
          make prepare-dist
          make build-windows

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kujira-cli-windows-amd64
          path: dist/windows/kujira-cli.exe
          if-no-files-found: error

  create-release:
    name: Create Release
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Linux AMD64 Artifact
        uses: actions/download-artifact@v4
        with:
          name: kujira-cli-linux-amd64
          path: dist/release/linux-amd64/

      - name: Download Linux ARM64 Artifact
        uses: actions/download-artifact@v4
        with:
          name: kujira-cli-linux-arm64
          path: dist/release/linux-arm64/

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: kujira-cli-windows-amd64
          path: dist/release/windows-amd64/

      - name: Stage release assets
        run: |
          mkdir -p dist/release
          cp dist/release/linux-amd64/kujira-cli dist/release/kujira-cli_linux_amd64
          cp dist/release/linux-arm64/kujira-cli-arm64 dist/release/kujira-cli_linux_arm64
          cp dist/release/windows-amd64/kujira-cli.exe dist/release/kujira-cli_windows_amd64.exe
          chmod +x dist/release/kujira-cli_linux_amd64 dist/release/kujira-cli_linux_arm64
          cd dist/release
          sha256sum kujira-cli_linux_amd64 kujira-cli_linux_arm64 kujira-cli_windows_amd64.exe > checksums.txt
          ls -lh

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/release/kujira-cli_linux_amd64
            dist/release/kujira-cli_linux_arm64
            dist/release/kujira-cli_windows_amd64.exe
            dist/release/checksums.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
