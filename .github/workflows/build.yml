name: Go Build

on:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.24.x'
        cache: true
        
    - name: Build
      # SOLUCIÓN: Compila solo el paquete main, no todos los paquetes
      run: go build -v -o kujira-cli_linux .
    
    - name: Fix Linux permissions
      run: chmod +x kujira-cli_linux
      
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: kujira-cli-linux
        path: kujira-cli_linux

  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.24.x'
        cache: true
      
    - name: Build
      # Misma solución para Windows
      run: go build -v -o kujira-cli_windows.exe .
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: kujira-cli-windows
        path: kujira-cli_windows.exe
