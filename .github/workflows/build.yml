name: Build and Release

on:
  push:
    tags:
      - "v*" # Se activa con tags que empiecen con 'v' (ej: v1.0.0)
  workflow_dispatch: # Permite ejecutarlo manualmente

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.24.x"
          cache: true

      - name: Build Linux binary
        run: |
          make prepare-dist
          make dist/linux/kujira-cli

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kujira-cli-linux
          path: dist/linux/kujira-cli
          if-no-files-found: error

  build-windows:
    name: Build Windows
    runs-on: ubuntu-latest
    needs: build-linux

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.24.x"
          cache: true

      - name: Install Windows build dependencies
        run: |
          # Instalar goversioninfo para Windows
          go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@latest
          # Instalar dependencias para la compilación cruzada
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64 gcc-multilib
          # Instalar ImageMagick para el ícono
          sudo apt-get install -y imagemagick

      - name: Build Windows binary
        run: |
          make prepare-dist
          make dist/windows/kujira-cli.exe

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kujira-cli-windows
          path: dist/windows/kujira-cli.exe
          if-no-files-found: error

  create-release:
    name: Create Release
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: kujira-cli-linux
          path: dist/linux/

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: kujira-cli-windows
          path: dist/windows/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/linux/kujira-cli
            dist/windows/kujira-cli.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
